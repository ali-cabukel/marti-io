name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: project-837fb0e4-3ce2-42cf-be2
  PROJECT_NUMBER: "124575765453"
  REGION: europe-west2
  REPOSITORY: dockerhub
  IMAGE: marti-io
  SERVICE: marti-io
  WORKLOAD_IDENTITY_PROVIDER: projects/124575765453/locations/global/workloadIdentityPools/github/providers/github-oidc
  SERVICE_ACCOUNT: cloud-run-deployer@project-837fb0e4-3ce2-42cf-be2.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: agents
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --platform=managed \
            --service-account="${{ env.SERVICE_ACCOUNT }}" \
            --port=8000 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --min-instances=0 \
            --max-instances=1 \
            --update-env-vars="APP_ENV=production,API_PREFIX=/api,API_HOST=0.0.0.0,API_PORT=8000,API_RELOAD=false,WS_PING_INTERVAL=30,WS_PING_TIMEOUT=30,TIMEOUT_KEEP_ALIVE=120,RATE_LIMIT_DEFAULT=60/minute,RATE_LIMIT_CHAT=20/minute,OPENAI_BASE_URL=https://openrouter.ai/api/v1,OPENAI_MODEL=openai/gpt-4o-mini,CHECKPOINTER=postgres,DATABASE_SCHEMA=marti-io" \
            --update-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest"
